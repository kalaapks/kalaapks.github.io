<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Probability Density Ribbons Prototype</title>
  <style>
    :root {
      --bg-radial: radial-gradient(circle at 50% 15%, #0f2744 0%, #050b14 50%, #0a192f 100%);
      --btn-bg: #161b22;
      --btn-border: #30363d;
      --btn-text: #c9d1d9;
    }
    body.light-mode {
      --bg-radial: radial-gradient(circle at 50% 15%, #ede9dc 0%, #fbfbfa 60%, #f2f1ec 100%);
      --btn-bg: #e8e3d5;
      --btn-border: #c8c0ae;
      --btn-text: #23272d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg-radial);
      background-attachment: fixed;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: monospace;
      transition: background 0.3s ease;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .theme-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--btn-text);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: transform 0.2s ease;
    }
    .theme-btn:hover { transform: scale(1.08); }
    .label {
      position: fixed;
      bottom: 20px;
      left: 24px;
      color: var(--btn-text);
      opacity: 0.6;
      font-size: 0.85rem;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <button class="theme-btn" id="themeBtn" title="Toggle Light / Dark Mode">💡</button>
  <div class="label">Evolving Probability Density Kernels (Fokker-Planck Wave)</div>
  <canvas id="simCanvas"></canvas>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const themeBtn = document.getElementById('themeBtn');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
    });

    // 5 stacked Gaussian density waves
    const NUM_RIBBONS = 5;
    const RESOLUTION = 140;

    let time = 0;
    function animate() {
      ctx.clearRect(0, 0, width, height);
      time += 0.007;

      const isLight = document.body.classList.contains('light-mode');

      for (let r = 0; r < NUM_RIBBONS; r++) {
        const baseY = height * (0.35 + r * 0.11);
        
        // Dynamically breathing distribution parameters
        const mu1 = width * (0.35 + 0.18 * Math.sin(time * 0.7 + r * 0.8));
        const sigma1 = width * (0.12 + 0.04 * Math.cos(time * 0.5 + r));
        
        const mu2 = width * (0.65 + 0.15 * Math.cos(time * 0.6 - r * 0.7));
        const sigma2 = width * (0.10 + 0.03 * Math.sin(time * 0.8 + r));

        const amplitude = height * 0.18;

        ctx.beginPath();
        for (let i = 0; i <= RESOLUTION; i++) {
          const x = (i / RESOLUTION) * width;

          // Mixture of 2 Gaussian density kernels + drift
          const g1 = Math.exp(-Math.pow(x - mu1, 2) / (2 * sigma1 * sigma1));
          const g2 = Math.exp(-Math.pow(x - mu2, 2) / (2 * sigma2 * sigma2));
          const density = (g1 * 0.65 + g2 * 0.55);

          const y = baseY - density * amplitude + Math.sin(x * 0.004 + time + r) * 6;

          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }

        // Stroke line
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = isLight 
          ? `rgba(30, 96, 145, ${0.12 + r * 0.02})` 
          : `rgba(88, 166, 255, ${0.12 + r * 0.03})`;
        ctx.stroke();

        // Downward soft baseline fill
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.closePath();
        ctx.fillStyle = isLight
          ? `rgba(43, 122, 62, 0.015)`
          : `rgba(63, 185, 80, 0.015)`;
        ctx.fill();
      }

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
