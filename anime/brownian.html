<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brownian Streamlines Prototype</title>
  <style>
    :root {
      --bg-radial: radial-gradient(circle at 50% 15%, #0f2744 0%, #050b14 50%, #0a192f 100%);
      --btn-bg: #161b22;
      --btn-border: #30363d;
      --btn-text: #c9d1d9;
    }
    body.light-mode {
      --bg-radial: radial-gradient(circle at 50% 15%, #ede9dc 0%, #fbfbfa 60%, #f2f1ec 100%);
      --btn-bg: #e8e3d5;
      --btn-border: #c8c0ae;
      --btn-text: #23272d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg-radial);
      background-attachment: fixed;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: monospace;
      transition: background 0.3s ease;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .theme-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--btn-text);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: transform 0.2s ease;
    }
    .theme-btn:hover { transform: scale(1.08); }
    .label {
      position: fixed;
      bottom: 20px;
      left: 24px;
      color: var(--btn-text);
      opacity: 0.6;
      font-size: 0.85rem;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <button class="theme-btn" id="themeBtn" title="Toggle Light / Dark Mode">💡</button>
  <div class="label">Coupled Brownian / Ornstein-Uhlenbeck Streamlines</div>
  <canvas id="simCanvas"></canvas>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const themeBtn = document.getElementById('themeBtn');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
    });

    // Coupled stream paths
    const NUM_PATHS = 26;
    const SEGMENTS = 90;
    const paths = [];

    for (let i = 0; i < NUM_PATHS; i++) {
      paths.push({
        baseYRatio: (i + 1) / (NUM_PATHS + 1),
        yOffsets: new Float32Array(SEGMENTS),
        velocities: new Float32Array(SEGMENTS),
        speed: 0.8 + Math.random() * 0.4,
        phase: Math.random() * Math.PI * 2,
        noiseSeed: Math.random() * 100
      });
    }

    let t = 0;
    function animate() {
      ctx.clearRect(0, 0, width, height);
      t += 0.008;

      const isLight = document.body.classList.contains('light-mode');

      for (let p of paths) {
        const baseY = p.baseYRatio * height;
        const stepX = width / (SEGMENTS - 1);

        ctx.beginPath();
        for (let j = 0; j < SEGMENTS; j++) {
          const x = j * stepX;
          
          // Ornstein-Uhlenbeck velocity drift: dv = -theta*v*dt + sigma*dW
          const dW = (Math.sin(j * 0.15 + t * p.speed + p.phase) + Math.cos(j * 0.08 - t * 0.5 + p.noiseSeed)) * 0.5;
          const theta = 0.04;
          p.velocities[j] += -theta * p.velocities[j] + dW * 0.45;
          p.yOffsets[j] += p.velocities[j];

          // Mild decay clamp to keep streamlines bounded
          p.yOffsets[j] *= 0.985;

          const y = baseY + p.yOffsets[j] * 24;

          if (j === 0) ctx.moveTo(x, y);
          else {
            const prevX = (j - 1) * stepX;
            const prevY = baseY + p.yOffsets[j - 1] * 24;
            const midX = (prevX + x) / 2;
            const midY = (prevY + y) / 2;
            ctx.quadraticCurveTo(prevX, prevY, midX, midY);
          }
        }

        ctx.lineWidth = 1.0;
        ctx.strokeStyle = isLight 
          ? 'rgba(43, 85, 62, 0.13)' 
          : 'rgba(63, 185, 80, 0.12)';
        ctx.stroke();

        // Secondary subtle harmonic overlay
        ctx.lineWidth = 0.5;
        ctx.strokeStyle = isLight 
          ? 'rgba(30, 96, 145, 0.10)' 
          : 'rgba(88, 166, 255, 0.09)';
        ctx.stroke();
      }

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
