<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Derivation & Calculation</title>

  <!-- MathJax: render LaTeX in the browser -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        macros: {
          E: '\\mathbb{E}',
          R: '\\mathbb{R}',
          ind: ['\\mathbf{1}_{\\{#1\\}}', 1]
        }
      },
      chtml: {
        // lets long inline formulas wrap instead of pushing the page wider
        linebreaks: { automatic: true, width: 'container' }
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    :root {
      --page-bg-top: #e8dbb0;
      --page-bg-bottom: #d6c48e;
      --page-glow: #f1e7c4;
      --card-bg: #efe5c2;
      --terminal-header: #dccb95;
      --inner-card-bg: #f6eed3;
      --border: #b9a56b;
      --text: #2a2616;
      --text-muted: #5f5429;
      --green: #23652f;
      --accent: #1e6091;
      --card-shadow: rgba(90, 70, 20, 0.18);
      --term-bg: #1f242c;
      --term-header: #161a20;
    }

    /* ---------- Grid (controlled by variables, switched by a class on <body>) ---------- */
    body {
      --grid-size: 48px;
      --grid-strength: 9%;
      --grid-color: rgba(128, 128, 128, 0.18);
      --grid-color-soft: rgba(128, 128, 128, 0.09);
      --grid-print: radial-gradient(circle, var(--grid-color) 1.2px, transparent 1.7px)
                    0 0 / var(--grid-size) var(--grid-size);
    }
    @supports (color: color-mix(in srgb, red, blue)) {
      body {
        --grid-color: color-mix(in srgb, var(--text) var(--grid-strength), transparent);
        --grid-color-soft: color-mix(in srgb, var(--text) 7%, transparent);
      }
    }
    /* PRINT 1 */
    body.grid-lines {
      --grid-print:
        linear-gradient(var(--grid-color) 1px, transparent 1px) 0 0 / var(--grid-size) var(--grid-size),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px) 0 0 / var(--grid-size) var(--grid-size);
    }
    /* PRINT 2 */
    body.grid-off {
      --grid-print: linear-gradient(transparent, transparent);
    }
    /* PRINT 3 Graph paper */
    body.grid-graph {
      --grid-print:
        linear-gradient(var(--grid-color) 1px, transparent 1px) 0 0 / calc(var(--grid-size) * 5) calc(var(--grid-size) * 5),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px) 0 0 / calc(var(--grid-size) * 5) calc(var(--grid-size) * 5),
        linear-gradient(var(--grid-color-soft) 1px, transparent 1px) 0 0 / var(--grid-size) var(--grid-size),
        linear-gradient(90deg, var(--grid-color-soft) 1px, transparent 1px) 0 0 / var(--grid-size) var(--grid-size);
    }
    /* PRINT 4 Diagonal hatch */
    body.grid-diag {
      --grid-print: repeating-linear-gradient(45deg, var(--grid-color) 0 1px, transparent 1px var(--grid-size));
    }
    /* PRINT 5 Large sparse dots */
    body.grid-dots-lg {
      --grid-size: 48px;
      --grid-print: radial-gradient(circle, var(--grid-color) 2px, transparent 2.6px) 0 0 / var(--grid-size) var(--grid-size);
    }

    /* ---------- Layout ---------- */
    *, *::before, *::after { box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      background-color: var(--page-bg-bottom);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: clamp(10px, 4vw, 32px);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        var(--grid-print),
        radial-gradient(circle at 50% 15%, var(--page-glow) 0%, var(--page-bg-top) 55%, var(--page-bg-bottom) 100%);
      background-attachment: fixed;
      /* never let the page itself scroll sideways */
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 760px;
      min-width: 0;                 /* lets the card shrink below its content width */
      margin: clamp(0px, 2vw, 20px) auto 0;
      padding: clamp(16px, 5vw, 32px);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 4px 16px var(--card-shadow);
    }

    .badge {
      display: inline-block;
      margin-bottom: 16px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      background: var(--inner-card-bg);
      border: 1px solid var(--border);
      border-radius: 9999px;
    }

    #content {
      min-width: 0;
      line-height: 1.7;
      font-size: clamp(15px, 2.2vw + 11px, 17px);
      overflow-wrap: anywhere;      /* long words / URLs never push the card wider */
    }
    #content p { margin: 0 0 1em; }
    #content code { color: var(--green); }

    /* Wide equations scroll inside their own box instead of leaving the card */
    #content mjx-container[display="true"] {
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 4px 0;
      margin: 0.8em 0 !important;
      -webkit-overflow-scrolling: touch;
    }
    #content mjx-container { max-width: 100%; }

    .muted {
      color: var(--text-muted);
      font-style: italic;
    }

    .hint {
      display: block;
      width: fit-content;
      max-width: 100%;
      margin: 14px auto 0;
      padding: 8px 14px;
      font: inherit;
      font-size: 13px;
      color: var(--text-muted);
      background: var(--inner-card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-align: center;
      cursor: pointer;              /* tapping it also changes the grid (for phones) */
    }
    .hint:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .hint kbd {
      padding: 1px 6px;
      font: inherit;
      font-weight: 600;
      color: var(--text);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    @media (max-width: 480px) {
      .container { border-radius: 8px; }
      .badge { font-size: 11px; }
      #content mjx-container[display="true"] { font-size: 92%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Derivation / Calculation</div>
    <div id="content">Loading calculation...</div>
  </div>

  <button type="button" class="hint" id="grid-hint">Click <kbd>G</kbd> on keyboard to change grids</button>

  <script>
    // ---------- Grid switcher: press G (or tap the hint box) to cycle ----------
    // '' = default dot grid; the rest are the body classes defined in the CSS
    const GRIDS = ['', 'grid-lines', 'grid-graph', 'grid-diag', 'grid-dots-lg', 'grid-off'];
    let gridIndex = 0;

    function applyGrid(i) {
      document.body.classList.remove(...GRIDS.filter(Boolean));
      if (GRIDS[i]) document.body.classList.add(GRIDS[i]);
      gridIndex = i;
      try { localStorage.setItem('gridIndex', String(i)); } catch (e) {}
    }
    function nextGrid() { applyGrid((gridIndex + 1) % GRIDS.length); }

    try {
      const saved = parseInt(localStorage.getItem('gridIndex'), 10);
      if (saved >= 0 && saved < GRIDS.length) applyGrid(saved);
    } catch (e) {}

    document.addEventListener('keydown', e => {
      if (e.key.toLowerCase() !== 'g' || e.ctrlKey || e.metaKey || e.altKey) return;
      const t = e.target;
      if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
      nextGrid();
    });
    document.getElementById('grid-hint').addEventListener('click', nextGrid);

    // ---------- Load and render the calculation ----------
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const contentDiv = document.getElementById('content');

    // Escape &, <, > so math like "i<j" or "a & b" is not parsed as HTML
    const escapeHtml = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    if (!id) {
      contentDiv.innerHTML = '<p class="muted">No calculation specified.</p>';
    } else {
      fetch(`items/${encodeURIComponent(id)}.txt`)
        .then(response => {
          if (!response.ok) throw new Error('Not found');
          return response.text();
        })
        .then(text => {
          // Blank line = new paragraph
          const html = escapeHtml(text.trim())
            .split(/\n\s*\n/)
            .map(block => `<p>${block}</p>`)
            .join('');
          contentDiv.innerHTML = html;

          const typeset = () => MathJax.typesetPromise([contentDiv]);
          if (window.MathJax && MathJax.startup && MathJax.startup.promise) {
            MathJax.startup.promise.then(typeset);
          } else {
            window.addEventListener('load', () => MathJax.startup.promise.then(typeset));
          }
        })
        .catch(() => {
          contentDiv.innerHTML = `<p class="muted">Calculation <code>${escapeHtml(id)}</code> not found.</p>`;
        });
    }
  </script>
</body>
</html>
